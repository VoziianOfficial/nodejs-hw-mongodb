# swagger/components/schemas/student.yaml

type: object
required:
  - name
  - phoneNumber
  - contactType
properties:
  name:
    type: string
    description: Name of the contact
    example: John Doe
  phoneNumber:
    type: string
    description: Phone number of the contact
    example: '+1234567890'
  email:
    type: string
    description: Email address of the contact
    example: john.doe@example.com
  isFavourite:
    type: boolean
    description: Whether the contact is marked as favorite
    example: false
  contactType:
    type: string
    description: Type of the contact
    enum:
      - work
      - home
      - personal
    example: personal
  photo:
    type: string
    description: Link to the contact's photo
    example: https://example.com/photo.jpg
