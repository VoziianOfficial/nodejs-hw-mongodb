#/swagger/paths/contacts/get.yaml
tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve a list of all contacts with optional filtering, sorting, and pagination.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      description: Page number for pagination
      example: 1
  - in: query
    name: limit
    schema:
      type: integer
      description: Number of items per page
      example: 10
  - in: query
    name: search
    schema:
      type: string
      description: Search term to filter contacts by name or phone number
      example: "John"
  - in: query
    name: sortBy
    schema:
      type: string
      description: Field to sort by (e.g., name, createdAt)
      example: "name"
responses:
  '200':
    description: Successfully retrieved list of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contacts retrieved successfully.
            data:
              type: array
              items:
                $ref: ../../components/schema/contacts.yaml
  '401':
    $ref: ../../components/responses/401.yaml
