#swagger/paths/contacts/{id}/patch.yaml

tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: Update specific fields of a contact by its unique ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "Jane Doe"
          phoneNumber:
            type: string
            example: "+9876543210"
          email:
            type: string
            example: "jane.doe@example.com"
          isFavourite:
            type: boolean
            example: true
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully.
            data:
              $ref: ../../../components/schema/contacts.yaml
  '404':
    description: Contact not found
  '401':
    $ref: '../../../components/responses/401.yaml'
